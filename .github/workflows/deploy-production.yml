name: Deploy Pull-it Docs to Yeon Pi

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'preflight은 Pi에 쓰지 않고 전송 경로만 검증합니다.'
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy]
  push:
    branches: [main]
    paths:
      - api/**
      - prisma/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - Dockerfile
      - docker-compose.prod.yml
      - ops/production/**
      - .github/actions/**
      - .github/workflows/deploy-production.yml

permissions:
  contents: read

concurrency:
  group: pullit-docs-production
  cancel-in-progress: false

jobs:
  transport-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pullit-docs-production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-cloudflared
      - name: Verify Cloudflare Access and the restricted Pi command path
        env:
          DEPLOY_KEY: ${{ secrets.PULLIT_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PULLIT_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          PULLIT_DOCS_DB_PASSWORD: ${{ secrets.PULLIT_DOCS_DB_PASSWORD }}
        run: |
          set -euo pipefail
          required=(DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET PULLIT_DOCS_DB_PASSWORD)
          for name in "${required[@]}"; do test -n "${!name}"; done
          case "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" in 'CF-Access-Client-Id:'*) exit 1 ;; esac
          case "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET" in 'CF-Access-Client-Secret:'*) exit 1 ;; esac
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "CF-Access-Client-Id: $PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET" "https://$DEPLOY_HOST")"
          test "$status" = 200 || { echo "Cloudflare Access service-token probe returned HTTP $status" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host %s\n' "$DEPLOY_HOST" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" --service-token-secret "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 ~/.ssh/config
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "pullit-deploy@$DEPLOY_HOST" \
            'test -d /opt/pullit/incoming && test -w /opt/pullit/incoming && sudo -n -l /usr/local/sbin/pullit-deploy >/dev/null'
  build:
    needs: transport-preflight
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/hyeonjun0527/pullit-docs-server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: [transport-preflight, build]
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pullit-docs-production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-cloudflared
      - name: Configure the dedicated Pi deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.PULLIT_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PULLIT_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host %s\n' "$DEPLOY_HOST" > ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" --service-token-secret "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 ~/.ssh/config
      - name: Upload only this revision's docs contract
        env:
          PULLIT_DOCS_IMAGE: ghcr.io/hyeonjun0527/pullit-docs-server:${{ github.sha }}
          PULLIT_DOCS_DB_PASSWORD: ${{ secrets.PULLIT_DOCS_DB_PASSWORD }}
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID }}
          PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$PULLIT_DOCS_DB_PASSWORD" && test -n "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_ID" && test -n "$PULLIT_CLOUDFLARE_ACCESS_CLIENT_SECRET"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          umask 077
          printf 'PULLIT_DOCS_IMAGE=%s\nPULLIT_DOCS_DB_PASSWORD=%s\n' "$PULLIT_DOCS_IMAGE" "$PULLIT_DOCS_DB_PASSWORD" > "$staging/pullit-docs-production.env"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "pullit-deploy@$DEPLOY_HOST" "mkdir -p /opt/pullit/incoming/docs/${{ github.sha }}"
          scp -i ~/.ssh/id_ed25519 -r "$staging/." "pullit-deploy@$DEPLOY_HOST:/opt/pullit/incoming/docs/${{ github.sha }}/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "pullit-deploy@$DEPLOY_HOST" "sudo /usr/local/sbin/pullit-deploy docs ${{ github.sha }}"
