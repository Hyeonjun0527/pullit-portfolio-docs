name: Pull-it Docs check

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "prisma/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "ops/production/**"
      - ".env.example"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "prisma/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "ops/production/**"
      - ".env.example"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check api/index.js
